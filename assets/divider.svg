<svg width="800" height="16" viewBox="0 0 800 16" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Left Solid Line -->
  <path d="M0 8 L 380 8" stroke="#06b6d4" stroke-width="2" />
  
  <!-- Center Classic Retro Pixel Diamond -->
  <g fill="#22d3ee">
    <!-- Top tip -->
    <rect x="398" y="2" width="4" height="2" />
    <!-- Upper body -->
    <rect x="396" y="4" width="8" height="2" fill="#cffafe" />
    <!-- Center belt -->
    <rect x="394" y="6" width="12" height="4" fill="#cffafe" />
    <!-- Lower body -->
    <rect x="396" y="10" width="8" height="2" fill="#cffafe" />
    <!-- Bottom tip -->
    <rect x="398" y="12" width="4" height="2" />
    
    <!-- Left satellite pixel -->
    <rect x="386" y="6" width="4" height="4" />
    <!-- Right satellite pixel -->
    <rect x="410" y="6" width="4" height="4" />
  </g>

  <!-- Right Solid Line -->
  <path d="M420 8 L 800 8" stroke="#06b6d4" stroke-width="2" />
</svg>
